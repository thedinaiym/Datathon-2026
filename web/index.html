<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Проверка кассовой дисциплины по видео</title>
<style>
  :root {
    --bg: #f6f7f9; --card: #ffffff; --text: #1b1f24; --muted: #5d6673; --line: #dde1e6;
    --accent: #1f5fbf; --ok-bg: #e6f4ea; --ok: #1e6b34; --bad-bg: #fdecea; --bad: #a3231a;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121417; --card: #1b1e23; --text: #e8eaed; --muted: #9aa3ad; --line: #2c3138;
      --accent: #6aa3ff; --ok-bg: #16301f; --ok: #7fd49a; --bad-bg: #3a1b18; --bad: #ff9a8f;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); }
  main { max-width: 980px; margin: 0 auto; padding: 24px 16px 48px; }
  h1 { font-size: 1.5rem; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 20px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px; margin-bottom: 16px; }
  .row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  input[type=file] { max-width: 100%; }
  input[type=text] { padding: 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--text); min-width: 260px; }
  button { padding: 10px 18px; border: 0; border-radius: 8px; background: var(--accent); color: #fff; font-weight: 600; cursor: pointer; }
  button.secondary { background: transparent; color: var(--accent); border: 1px solid var(--accent); }
  button:disabled { opacity: .5; cursor: default; }
  .bar { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; margin-top: 10px; }
  .bar > div { height: 100%; width: 0; background: var(--accent); transition: width .2s; }
  .status { margin-top: 8px; color: var(--muted); }
  .error { color: var(--bad); margin-top: 8px; white-space: pre-wrap; }
  video { width: 100%; max-height: 420px; border-radius: 8px; background: #000; }
  .verdict { padding: 14px 16px; border-radius: 10px; font-weight: 700; font-size: 1.15rem; margin-bottom: 12px; }
  .verdict.ok { background: var(--ok-bg); color: var(--ok); }
  .verdict.bad { background: var(--bad-bg); color: var(--bad); }
  .viol h3 { margin: 0 0 6px; font-size: 1.1rem; }
  .tc { display: inline-block; margin-bottom: 8px; }
  .frames { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 10px; }
  .frames figure { margin: 0; }
  .frames img { width: 220px; max-width: 100%; border-radius: 6px; border: 1px solid var(--line); cursor: zoom-in; display: block; }
  .frames figcaption { font-size: .85rem; color: var(--muted); }
  .note { color: var(--muted); font-size: .9rem; }
  dialog { border: 0; padding: 0; background: transparent; max-width: 95vw; }
  dialog img { max-width: 95vw; max-height: 90vh; border-radius: 8px; display: block; }
  dialog::backdrop { background: rgba(0,0,0,.8); }
  .hidden { display: none; }
</style>
</head>
<body>
<main>
  <h1>Проверка кассовой дисциплины по видео</h1>
  <p class="sub">Загрузите запись с камеры кассы. Результат — подсказка для проверяющего, а не окончательное заключение.</p>

  <section class="card" id="keyBox">
    <div class="row">
      <label for="key">API-ключ:</label>
      <input type="text" id="key" autocomplete="off" placeholder="вставьте ключ">
    </div>
  </section>

  <section class="card">
    <div class="row">
      <input type="file" id="file" accept=".mov,.mp4,video/quicktime,video/mp4">
      <button id="go" disabled>Проверить</button>
      <button id="reset" class="secondary hidden">Проверить другое видео</button>
    </div>
    <div class="bar"><div id="progress"></div></div>
    <div class="status" id="status"></div>
    <div class="error" id="error"></div>
  </section>

  <section class="card hidden" id="playerBox">
    <video id="player" controls playsinline></video>
    <p class="note">Если браузер не воспроизводит .mov, кадры-доказательства ниже всё равно доступны.</p>
  </section>

  <section id="result"></section>
</main>

<dialog id="zoom"><img id="zoomImg" alt="Кадр-доказательство крупно"></dialog>

<script>
  // Сервис подставляет значения сам. Для отдельного фронтенда (Vercel) впишите адрес API и ключ интерфейса.
  const CONFIG = { apiBase: "__API_BASE__", apiKey: "__UI_KEY__" };
  const apiBase = CONFIG.apiBase.startsWith("__") ? "" : CONFIG.apiBase.replace(/\/$/, "");
  const injectedKey = CONFIG.apiKey.startsWith("__") ? "" : CONFIG.apiKey;

  const $ = id => document.getElementById(id);
  const fileInput = $("file"), goBtn = $("go"), resetBtn = $("reset"), keyInput = $("key");
  let objectUrl = null;

  if (injectedKey) $("keyBox").classList.add("hidden");
  else keyInput.value = sessionStorage.getItem("apiKey") || "";
  const apiKey = () => injectedKey || keyInput.value.trim();

  function setStatus(text, frac) {
    $("status").textContent = text;
    if (frac !== null && frac !== undefined) $("progress").style.width = Math.round(frac * 100) + "%";
  }
  function setError(text) { $("error").textContent = text || ""; }
  function fmtTime(sec) {
    const m = Math.floor(sec / 60), s = (sec - m * 60).toFixed(1).padStart(4, "0");
    return `${m}:${s}`;
  }
  function el(tag, attrs = {}, text) {
    const e = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
    if (text !== undefined) e.textContent = text;
    return e;
  }

  fileInput.addEventListener("change", () => {
    const f = fileInput.files[0];
    goBtn.disabled = !f;
    setError(""); $("result").innerHTML = "";
    if (objectUrl) URL.revokeObjectURL(objectUrl);
    if (f) {
      objectUrl = URL.createObjectURL(f);
      $("player").src = objectUrl;
      $("playerBox").classList.remove("hidden");
      setStatus(`${f.name}, ${(f.size / 1048576).toFixed(1)} МБ`, 0);
    }
  });

  function upload(file) {
    return new Promise((resolve, reject) => {
      const xhr = new XMLHttpRequest();
      xhr.open("POST", apiBase + "/api/v1/analyze");
      xhr.setRequestHeader("X-API-Key", apiKey());
      xhr.upload.onprogress = e => {
        if (e.lengthComputable) setStatus(`Загрузка видео… ${Math.round(e.loaded / e.total * 100)}%`, e.loaded / e.total);
      };
      xhr.onload = () => {
        let body = {};
        try { body = JSON.parse(xhr.responseText); } catch (_) {}
        if (xhr.status >= 200 && xhr.status < 300) resolve(body);
        else if (xhr.status === 401) reject(new Error("Неверный API-ключ."));
        else reject(new Error(`Ошибка загрузки (${xhr.status}): ${body.detail || xhr.statusText}`));
      };
      xhr.onerror = () => reject(new Error("Сервис недоступен. Проверьте адрес и подключение."));
      const fd = new FormData();
      fd.append("file", file);
      xhr.send(fd);
    });
  }

  async function poll(jobId) {
    const t0 = Date.now();
    for (;;) {
      const r = await fetch(`${apiBase}/api/v1/jobs/${jobId}`, { headers: { "X-API-Key": apiKey() } });
      if (!r.ok) throw new Error(`Ошибка получения статуса (${r.status}).`);
      const j = await r.json();
      if (j.status === "done") return j;
      if (j.status === "failed") throw new Error("Обработка не удалась. " + (j.error || ""));
      setStatus(`Анализ видео… ${Math.round((Date.now() - t0) / 1000)} с`, 1);
      await new Promise(res => setTimeout(res, 3000));
    }
  }

  function render(j) {
    const box = $("result");
    box.innerHTML = "";
    const viol = j.verdict === "violation";
    box.appendChild(el("div", { class: "verdict " + (viol ? "bad" : "ok") },
      viol ? "Обнаружены признаки возможных нарушений" : "Нарушение не обнаружено"));
    (j.violations || []).forEach((v, i) => {
      const card = el("article", { class: "card viol" });
      card.appendChild(el("h3", {}, `${i + 1}. ${v.type}`));
      const tc = el("button", { class: "secondary tc", type: "button" }, `▶ ${fmtTime(v.timecode_sec)}`);
      tc.addEventListener("click", () => {
        const p = $("player");
        p.currentTime = v.timecode_sec;
        p.play().catch(() => {});
        p.scrollIntoView({ behavior: "smooth", block: "center" });
      });
      card.appendChild(tc);
      card.appendChild(el("p", {}, v.description));
      const frames = el("div", { class: "frames" });
      (v.evidence_frames || []).forEach(f => {
        const fig = el("figure");
        const img = el("img", { src: "data:image/jpeg;base64," + f.image_base64, alt: `Кадр ${fmtTime(f.timestamp_sec)}` });
        img.addEventListener("click", () => { $("zoomImg").src = img.src; $("zoom").showModal(); });
        fig.appendChild(img);
        fig.appendChild(el("figcaption", {}, `Кадр ${fmtTime(f.timestamp_sec)}`));
        frames.appendChild(fig);
      });
      card.appendChild(frames);
      box.appendChild(card);
    });
  }

  goBtn.addEventListener("click", async () => {
    const f = fileInput.files[0];
    if (!f) return;
    if (!apiKey()) { setError("Введите API-ключ."); return; }
    if (!injectedKey) sessionStorage.setItem("apiKey", apiKey());
    goBtn.disabled = true; fileInput.disabled = true; setError(""); $("result").innerHTML = "";
    try {
      const { job_id } = await upload(f);
      const result = await poll(job_id);
      setStatus(`Готово. Задача ${job_id}.`, 1);
      render(result);
    } catch (e) {
      setError(e.message);
      setStatus("", 0);
    } finally {
      fileInput.disabled = false;
      resetBtn.classList.remove("hidden");
    }
  });

  resetBtn.addEventListener("click", () => {
    fileInput.value = ""; goBtn.disabled = true; resetBtn.classList.add("hidden");
    $("result").innerHTML = ""; setError(""); setStatus("", 0);
    $("playerBox").classList.add("hidden");
    if (objectUrl) { URL.revokeObjectURL(objectUrl); objectUrl = null; }
  });

  $("zoom").addEventListener("click", () => $("zoom").close());
</script>
</body>
</html>
